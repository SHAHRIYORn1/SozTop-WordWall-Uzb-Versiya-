<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>So'zTop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap">
<style>
:root{--bg:#e9eff8;--card:#fff;--ink:#12213a;--mut:#5d6c84;--pri:#2f5bea;--ok:#12a06c;--bad:#e5484d;--tile:#ffd23f;--ln:#d3ddec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#172238;--ink:#e9effb;--mut:#9aaac4;--pri:#7c9bff;--ok:#2fcf97;--bad:#ff7a7f;--ln:#2a3957}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#172238;--ink:#e9effb;--mut:#9aaac4;--pri:#7c9bff;--ok:#2fcf97;--bad:#ff7a7f;--ln:#2a3957}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:16px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.wm{background:none;border:0;padding:0;display:flex;gap:3px}
.tl{display:inline-grid;place-items:center;width:34px;height:40px;background:var(--tile);color:#3a2a00;font:800 24px 'Baloo 2',sans-serif;border-radius:6px;box-shadow:0 3px 0 #c9a100}
.lg{display:flex;gap:6px}
.lb{border:2px solid var(--ln);background:var(--card);border-radius:10px;padding:2px 8px;font-size:20px}
.lb.on{border-color:var(--pri)}
h1{font:800 clamp(26px,5vw,40px)/1.15 'Baloo 2',sans-serif;margin:28px 0 12px}
.pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px;color:var(--mut)}
select,input,textarea{background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:180px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.gc{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--ln);border-left:8px solid hsl(var(--h) 70% 55%);border-radius:14px;padding:12px 14px;transition:transform .15s}
.gc:not(:disabled):hover{transform:translateY(-2px)}
.gc .em{font-size:28px}.gc .nm{font:600 18px 'Baloo 2',sans-serif;line-height:1.2}
.gc.soon{opacity:.55;cursor:default}
.bd{position:absolute;right:10px;top:8px;font-size:12px;color:var(--mut)}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--pri);color:#fff;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ln)}
.btn.bad2{background:var(--bad);color:#fff}.btn.ok2{background:var(--ok);color:#fff}
.row{display:flex;gap:12px;align-items:center;margin:18px 0}
.prog{flex:1;height:12px;background:var(--ln);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.game{background:var(--card);border-radius:18px;padding:20px;min-height:320px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.big{font:800 clamp(32px,8vw,56px)/1.1 'Baloo 2',sans-serif;text-align:center;margin:8px 0}
.mut{color:var(--mut);text-align:center;margin:0}
.opt{border:2px solid var(--ln);background:var(--bg);border-radius:12px;padding:12px;font-weight:700;font-size:18px}
.opt.ok,.mc.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad,.mc.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:sh .3s}
.opt.sel{border-color:var(--pri);background:var(--pri);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.card3d{min-height:170px;display:grid;place-items:center;text-align:center;padding:16px;border-radius:18px;background:var(--pri);color:#fff;font:800 clamp(28px,7vw,44px) 'Baloo 2',sans-serif;border:0;cursor:pointer}
.card3d.back{background:var(--ok)}
.row2{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:640px){.mem{grid-template-columns:repeat(4,1fr)}}
.mc{min-height:80px;border:2px solid var(--ln);border-radius:12px;background:var(--bg);font:700 18px Nunito,sans-serif;padding:6px}
.mc.open{background:var(--tile);color:#3a2a00;border-color:var(--tile)}
.slots,.pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:56px}
.lt{width:48px;height:54px;border-radius:10px;border:2px solid var(--ln);background:var(--tile);color:#3a2a00;font:800 24px 'Baloo 2',sans-serif}
.lt:disabled{opacity:.25}.slots .lt{background:var(--bg);color:var(--ink)}
.slots.ok .lt{background:var(--ok);color:#fff}
.setrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.setrow .mut{flex:1;text-align:left}
.frm{display:grid;gap:10px;margin-top:20px;background:var(--card);padding:16px;border-radius:16px}
.frm .r{display:flex;gap:10px;flex-wrap:wrap}.frm .r>*{flex:1;min-width:120px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{-webkit-tap-highlight-color:transparent}body{touch-action:manipulation}
.btn,.opt,.lb,.mc{min-height:44px}.big{overflow-wrap:anywhere}.mask{letter-spacing:.08em}
.lt.wd{width:auto;padding:0 12px;font-size:18px}.lt.kb{width:36px;height:42px;font-size:16px}
.crow{display:flex;gap:10px;align-items:center;justify-content:space-between}.crow .opt{min-width:110px}
.wsg{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:100%;max-width:420px;margin:0 auto}
.wc{aspect-ratio:1;border:0;border-radius:6px;background:var(--bg);font:700 clamp(12px,4.4vw,20px) Nunito,sans-serif;padding:0;min-height:0}
.wc.sel{background:var(--pri);color:#fff}.wc.ok{background:var(--ok);color:#fff}
.chip{padding:4px 12px;border-radius:99px;border:2px solid var(--ln);font-weight:700}.chip.ok{background:var(--ok);color:#fff;text-decoration:line-through}
.xg{display:grid;gap:2px;justify-content:center;overflow-x:auto}.xc{position:relative;width:var(--cs);height:var(--cs)}
.xc input{width:100%;height:100%;padding:0;text-align:center;text-transform:uppercase;font-weight:700;border-radius:6px}
.xc small{position:absolute;left:3px;top:0;font-size:9px;color:var(--mut);pointer-events:none}
.cl{text-align:left;margin:2px 0}
@media(max-width:480px){#app{padding:10px}.game{padding:12px;min-height:260px}.tl{width:28px;height:34px;font-size:20px}.lt{width:40px;height:46px;font-size:20px}.opt{font-size:16px;padding:10px 8px}.mem{gap:6px}.hd{justify-content:center}h1{margin-top:20px}.btn{padding:10px 12px}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes bounce{0%,100%{transform:none}40%{transform:translateY(-14px)}}
.enter{animation:zoom .45s cubic-bezier(.2,.9,.3,1.25) both}.gc{animation:zoom .45s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i,0)*25ms)}
.slots .lt.new{animation:pop .2s}.slots.ok .lt{animation:bounce .5s both}.opt.ok{animation:pop .25s}
.opt,.lt,.btn{transition:transform .12s,background .2s}.opt:active,.lt:active,.btn:active{transform:scale(.95)}
input,textarea,select{font-size:16px}
.wheel{position:relative;width:min(86vw,340px);aspect-ratio:1;margin:8px auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.wheel canvas{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 8px 24px #0003;will-change:transform}
.pin{position:absolute;left:50%;top:-8px;width:0;height:0;border:13px solid transparent;border-top:24px solid var(--ink);border-bottom:0;transform:translateX(-50%);filter:drop-shadow(0 2px 2px #0005)}
.wq{display:flex;flex-direction:column;gap:10px}
@keyframes zoom{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes up{to{transform:translateY(-430px)}}
.hole{border:2px dashed var(--mut)!important;background:transparent!important;color:var(--ink)!important}
.hole.fl{border-style:solid!important;background:var(--tile)!important;color:#3a2a00!important;animation:pop .25s}
.slots .lt.hole{width:48px;height:54px}
.lt,.opt{user-select:none;-webkit-user-select:none}
.arena{position:relative;height:320px;overflow:hidden;border-radius:14px;background:linear-gradient(#bfe0ff,#eaf5ff)}
.bub{position:absolute;bottom:-80px;min-width:76px;min-height:76px;padding:10px;border-radius:50%;border:2px solid #fff9;background:radial-gradient(circle at 30% 30%,#fff,#7cc4ff);color:#12213a;font-weight:800;animation:up 7s linear both}
.bub.ok{background:var(--ok)!important;color:#fff}.bub.bad{background:var(--bad)!important;color:#fff}
@media(prefers-reduced-motion:reduce){.bub{bottom:auto;top:var(--y)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const FL={uz:'🇺🇿',en:'🇬🇧',ru:'🇷🇺',de:'🇩🇪'};
const L={
uz:{tag:"Tilni o'yin bilan o'rgan",teacher:"O'qituvchi paneli",back:"Orqaga",again:"Qayta o'ynash",home:"Bosh sahifa",score:"Natija",know:"Bilaman",dont:"Bilmayman",hint:"Maslahat",clear:"Tozalash",set:"To'plam",name:"To'plam nomi",from:"Qaysi tildan",to:"Qaysi tilga",words:"Har qatorda: so'z = tarjima",save:"Saqlash",del:"O'chirish",edit:"Tahrirlash",need:"Kamida 4 ta juftlik kerak",soon:"Tez orada",moves:"Yurishlar",good:"Ajoyib!",fine:"Yaxshi!",more:"Yana mashq qiling",flip:"Kartani bosing",w:"so'z",saved:"Saqlandi",newset:"Yangi to'plam",check:"Tekshirish",needimg:"Kamida 4 ta so'zni emoji bilan yozing (🍎 = olma) yoki «Rasmlar» to'plamini tanlang.",needcat:"Kategoriya qo'shing: so'z = tarjima = kategoriya (kamida 2 ta) yoki «Rasmlar» to'plamini tanlang.",alpha:"Alifbo tartibida bosing",spin:"Charxni barmoq bilan aylantiring!",translate:"🌐 Tarjima qilish",translating:"Tarjima qilinmoqda…",trfail:"Tarjimon ishlamadi. «so'z = tarjima» ko'rinishida yozing.",trhint:"Faqat so'z yozsangiz ham bo'ladi (olma yoki apple), tarjimasini avtomatik topaman."},
};
const LI={uz:0,en:1,ru:2,de:3};
const PLAY=[["quiz","🎯","Test"],["wheel","🎡","Omad charxpalagi"],["match","🔗","Juftliklarni topish"],["scramble","🔤","Harflarni tartiblash"],["dragl","🖐️","Harfni sudrab qo'y"],["memory","🧠","Xotira o'yini"],["fill","✏️","Bo'sh joyni to'ldirish"],["tf","✅","To'g'ri / Noto'g'ri"],["wsearch","🔍","So'z topish"],["crossword","🧩","Krossvord"],["cloze","🕳️","Teshik to'ldir (sudrab)"],["listen","🎧","Eshitish"],["hang","🪢","So'z taxmini"],["dictation","🎙️","Diktant"],["puzzle","🌀","Puzzle"],["bubble","🫧","Pufakchalar"],["race","🏎️","Poyga: raqibga qarshi"],["bomb","💣","Bomba"],["simon","🧬","Xotira zanjiri"],["spot","🕵️","Xatoni top"]];
const SEED=[{id:'demo',name:'Ingliz → O\'zbek: asosiy so\'zlar',from:'en',to:'uz',pairs:[['apple','olma'],['book','kitob'],['water','suv'],['house','uy'],['friend',"do'st"],['school','maktab'],['teacher',"o'qituvchi"],['bread','non']]}];
let S={lang:'uz',sets:LS.get('sets',SEED),cur:LS.get('cur',null),view:'home',edit:null};
if(!S.sets.length)S.sets=SEED;
if(!S.sets.find(x=>x.id===S.cur))S.cur=S.sets[0].id;
const t=k=>L[S.lang][k];
const save=()=>{LS.set('lang',S.lang);LS.set('sets',S.sets);LS.set('cur',S.cur)};
const curSet=()=>S.sets.find(x=>x.id===S.cur);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function h(tag,cls,txt,fn){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(fn)e.onclick=fn;return e}
function toast(m){const e=$('#toast');e.textContent=m;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}

function hdr(a){
  const d=h('header','hd');
  const wm=h('button','wm',null,()=>{S.view='home';render()});wm.setAttribute('aria-label',"So'zTop");
  [..."SO'ZTOP"].forEach((ch,i)=>{const s=h('span','tl',ch);s.style.transform='rotate('+[-4,3,-2,4,-3,2,-4][i]+'deg)';wm.append(s)});
  d.append(wm,h('button','btn ghost',t('teacher'),()=>{S.view=S.view==='teacher'?'home':'teacher';S.edit=null;render()}));
  a.append(d);
}
function render(){try{speechSynthesis.cancel()}catch(e){}RUNID++;const a=$('#app');a.replaceChildren();document.documentElement.lang=S.lang;(S.view==='teacher'?teacher:home)(a)}

function home(a){
  hdr(a);a.append(h('h1','',t('tag')));
  const sel=h('select');S.sets.forEach(s=>{const o=h('option','',s.name+' ('+s.pairs.length+')');o.value=s.id;sel.append(o)});
  sel.value=S.cur;sel.onchange=()=>{S.cur=sel.value;save()};
  const row=h('label','pick',t('set')+':');row.append(sel);a.append(row);
  const g=h('div','grid');
  PLAY.forEach(([id,e,n],i)=>{const b=h('button','gc',null,()=>start(id));b.style.setProperty('--h',i*47);b.style.setProperty('--i',i);b.append(h('span','em',e),h('span','nm',n));g.append(b)});
  a.append(g);
}

function start(id){
  const s=curSet();if(!s||s.pairs.length<4)return toast(t('need'));
  const a=$('#app');a.replaceChildren();hdr(a);
  const top=h('div','row'),pr=h('div','prog'),fill=h('i');pr.append(fill);
  top.append(h('button','btn ghost','← '+t('back'),render),pr);
  const box=h('div','game enter');a.append(top,box);
  const c={id:++RUNID,box,set:s,prog:p=>fill.style.width=Math.round(p*100)+'%',done(sc,tot,ex){
    const pc=tot?Math.round(sc/tot*100):0;c.prog(1);
    const r=h('div','row2');r.append(h('button','btn',t('again'),()=>start(id)),h('button','btn ghost',t('home'),render));
    box.replaceChildren(h('div','big',pc+'%'),h('p','mut',t('score')+': '+sc+'/'+tot+(ex?', '+ex:'')),h('p','mut',pc>=80?t('good'):pc>=50?t('fine'):t('more')),r);
  }};
  G[id](c,s.pairs);
}

const G={};let RUNID=0;
G.quiz=(c,w)=>{
  const q=sh(w).slice(0,10);let i=0,ok=0;
  const next=()=>{
    if(i>=q.length)return c.done(ok,q.length);c.prog(i/q.length);
    const [a,b]=q[i];
    const opts=sh([b,...sh(w.filter(x=>x[1]!==b)).slice(0,3).map(x=>x[1])]);
    c.box.replaceChildren(h('div','big',a),...opts.map(o=>{
      const bt=h('button','opt',o);
      bt.onclick=()=>{c.box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===b)x.classList.add('ok')});
        if(o===b)ok++;else bt.classList.add('bad');i++;setTimeout(next,800)};
      return bt}));
  };next();
};
G.match=(c,w)=>{
  const p=sh(w).slice(0,6);let sel=null,mis=0,m=0;
  const pick=(b,side,i)=>{
    if(sel&&sel.side===side){sel.b.classList.remove('sel');sel=null}
    if(!sel){sel={b,side,i};b.classList.add('sel');return}
    const s=sel;sel=null;s.b.classList.remove('sel');
    if(s.i===i){[s.b,b].forEach(x=>{x.classList.add('ok');x.disabled=true});m++;c.prog(m/p.length);
      if(m===p.length)setTimeout(()=>c.done(Math.max(0,p.length-mis),p.length),600)}
    else{mis++;[s.b,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),500)})}
  };
  const col=(arr,side)=>{const d=h('div','col');arr.forEach(([txt,i])=>d.append(h('button','opt',txt,function(){pick(this,side,i)})));return d};
  const two=h('div','two');
  two.append(col(sh(p.map((x,i)=>[x[0],i])),0),col(sh(p.map((x,i)=>[x[1],i])),1));
  c.box.append(two);
};
const tiles=(c,q,sp)=>{
  if(!q.length)return c.done(0,0);
  let i=0,ok=0;
  const next=()=>{
    if(i>=q.length)return c.done(ok,q.length);c.prog(i/q.length);
    if(c.id!==RUNID)return;c.box.classList.remove('enter');void c.box.offsetWidth;c.box.classList.add('enter');const a=q[i][0],word=sp(q[i][1]);
    const pool=sh(word.map(ch=>({ch,used:false})));let ans=[],hinted=false;
    const draw=()=>{
      const slots=h('div','slots'),pl=h('div','pool');
      ans.forEach((x,k)=>slots.append(h('button','lt'+(x.ch.length>1?' wd':''),x.ch,()=>{ans.splice(k);pool.forEach(y=>y.used=ans.includes(y));draw()})));
      if(ans.length)slots.lastChild.classList.add('new');pool.forEach(x=>{const b=h('button','lt'+(x.ch.length>1?' wd':''),x.ch,()=>{x.used=true;ans.push(x);draw();check()});b.disabled=x.used;pl.append(b)});
      const r=h('div','row2');
      r.append(h('button','btn ghost',t('clear'),()=>{ans=[];pool.forEach(y=>y.used=false);draw()}));
      c.box.replaceChildren(h('div','big',a),slots,pl,r);
    };
    const check=()=>{
      if(ans.length!==word.length)return;
      if(ans.map(x=>x.ch).join('')===word.join('')){
        if(!hinted)ok++;i++;const sl=c.box.querySelector('.slots');sl.classList.add('ok');[...sl.children].forEach((e,k)=>e.style.animationDelay=k*60+'ms');setTimeout(next,700)}
      else{const s=c.box.querySelector('.slots');s.style.animation='sh .3s';setTimeout(()=>{ans=[];pool.forEach(y=>y.used=false);draw()},400)}
    };
    draw();
  };next();
};
G.memory=(c,w)=>{
  const p=sh(w).slice(0,6);
  const cards=sh(p.flatMap((x,i)=>[{t:x[0],i},{t:x[1],i}]));
  let open=[],found=0,moves=0,lock=false;
  const g=h('div','mem');
  cards.forEach(k=>{
    const b=h('button','mc','?');
    b.onclick=()=>{
      if(lock||b.disabled||b.classList.contains('open'))return;
      b.textContent=k.t;b.classList.add('open');open.push([b,k]);
      if(open.length<2)return;
      moves++;lock=true;const [[b1,k1],[b2,k2]]=open;
      if(k1.i===k2.i){[b1,b2].forEach(x=>{x.classList.add('ok');x.disabled=true});found++;c.prog(found/p.length);open=[];lock=false;
        if(found===p.length)setTimeout(()=>c.done(found,moves,t('moves')+': '+moves),500)}
      else setTimeout(()=>{[b1,b2].forEach(x=>{x.textContent='?';x.classList.remove('open')});open=[];lock=false},900);
    };g.append(b)});
  c.box.append(g);
};

const mark=(e,g)=>e.classList.add(g?'ok':'bad');
const E=(tag,cls,...k)=>{const e=h(tag,cls);e.append(...k);return e};
const opts=(w,b)=>sh([b,...sh(w.filter(x=>x[1]!==b)).slice(0,3).map(x=>x[1])]);

  const trb=h('button','btn ghost',t('translate'),doTr);
  const sb=h('button','btn',t('save'),async()=>{
    await doTr();const pairs=parse().filter(x=>x.p).map(x=>x.p);
    if(pairs.length<4)return toast(t('need'));
    const name=nm.value.trim()||('Set '+(S.sets.length+1));
    if(e){Object.assign(e,{name,from:fr.value,to:to.value,pairs})}
    else{const n={id:String(Date.now()),name,from:fr.value,to:to.value,pairs};S.sets.push(n);S.cur=n.id}
    S.edit=null;save();render();toast(t('saved'))});
  f.append(h('b','',e?t('edit'):t('newset')),nm,r,h('p','mut',t('trhint')),ta,E('div','row2',trb,sb));
  if(e)f.append(h('button','btn ghost',t('back'),()=>{S.edit=null;render()}));
  a.append(f);
}
render();
</script>
